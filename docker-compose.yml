version: "3.8"

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sql_texter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/sql_texter
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/.venv
    command: sh -c "uvicorn main:app --host 0.0.0.0 --port 8080 --reload"
    depends_on:
      - db

volumes:
  pgdata:
